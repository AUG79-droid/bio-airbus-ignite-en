name: Validate BioLab changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Build production site
        run: npm run build

      - name: Install browser for workshop integration test
        run: npx playwright install --with-deps chromium
      - name: Test three independent team journeys in real browser
        run: node scripts/test-parallel-workshop.mjs
        env:
          BIOLAB_LANG: en
